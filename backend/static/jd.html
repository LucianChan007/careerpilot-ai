<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerPilot AI - JD解析</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            min-height: 320px;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            resize: vertical;
            font-size: 14px;
            line-height: 1.7;
            font-family: inherit;
            outline: none;
        }

        textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        .primary {
            background: #4f46e5;
            color: white;
        }

        .primary:hover {
            background: #4338ca;
        }

        .secondary {
            background: #eef2ff;
            color: #4338ca;
        }

        .secondary:hover {
            background: #e0e7ff;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            min-height: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .success {
            color: #15803d !important;
        }

        .error {
            color: #dc2626 !important;
        }

        .loading {
            color: #4338ca !important;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           结果区域
        ========================= */

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 20px;
            margin-bottom: 20px;
            gap: 20px;
        }

        .position {
            font-size: 28px;
            margin: 0 0 8px;
            color: #111827;
        }

        .company {
            color: #6b7280;
            font-size: 14px;
        }

        .badge {
            background: #ecfdf5;
            color: #047857;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .meta-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
        }

        .meta-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 7px;
        }

        .meta-value {
            font-weight: 600;
            color: #111827;
            word-break: break-word;
        }

        /* =========================
           薪资
        ========================= */

        .salary-box {
            margin-top: 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 15px 16px;
        }

        .salary-title {
            font-size: 12px;
            color: #15803d;
            margin-bottom: 6px;
        }

        .salary-value {
            font-size: 18px;
            font-weight: bold;
            color: #166534;
        }

        .salary-note {
            margin-top: 6px;
            font-size: 12px;
            color: #4b5563;
        }

        /* =========================
           Section
        ========================= */

        .section {
            margin-top: 26px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #111827;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 13px;
        }

        .tag.orange {
            background: #fff7ed;
            color: #c2410c;
        }

        .list {
            margin: 0;
            padding-left: 24px;
        }

        .list li {
            margin-bottom: 9px;
            line-height: 1.7;
            font-size: 14px;
        }

        /* =========================
           操作区域
        ========================= */

        .action-box {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .match-button {
            width: 100%;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: bold;
            background: #4f46e5;
            color: white;
        }

        .match-button:hover {
            background: #4338ca;
        }

        /* =========================
           JSON
        ========================= */

        pre {
            margin: 0;
            background: #111827;
            color: #e5e7eb;
            padding: 16px;
            border-radius: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
            line-height: 1.6;
        }

        /* =========================
           响应式
        ========================= */

        @media (max-width: 800px) {
            .meta-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .result-header {
                flex-direction: column;
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 24px 14px;
            }

            .meta-grid {
                grid-template-columns: 1fr;
            }

            .position {
                font-size: 23px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <!-- =========================
         页面标题
    ========================== -->

    <div class="header">

        <h1>
            CareerPilot AI
        </h1>

        <div class="subtitle">
            US03：岗位 JD 输入与结构化解析
        </div>

    </div>


    <!-- =========================
         JD 输入
    ========================== -->

    <div class="card">

        <h2>
            输入岗位 JD
        </h2>

        <textarea
            id="jdInput"
            placeholder="请把招聘网站上的完整岗位 JD 粘贴到这里……"
        ></textarea>


        <div class="buttons">

            <button
                type="button"
                class="primary"
                id="parseButton"
                onclick="parseJD()"
            >
                AI 解析 JD
            </button>


            <button
                type="button"
                class="secondary"
                onclick="fillSampleJD()"
            >
                填入示例 JD
            </button>


            <button
                type="button"
                class="secondary"
                onclick="clearJD()"
            >
                清空
            </button>

        </div>


        <div id="status"></div>

    </div>


    <!-- =========================
         解析结果
    ========================== -->

    <div
        id="resultCard"
        class="card hidden"
    >

        <div class="result-header">

            <div>

                <h2
                    id="position"
                    class="position"
                >
                    未识别岗位
                </h2>


                <div
                    id="company"
                    class="company"
                >
                    公司：未提供
                </div>

            </div>


            <div class="badge">
                AI 结构化解析
            </div>

        </div>


        <!-- 基础信息 -->

        <div class="meta-grid">

            <div class="meta-item">

                <div class="meta-label">
                    工作地点
                </div>

                <div
                    id="location"
                    class="meta-value"
                >
                    未提供
                </div>

            </div>


            <div class="meta-item">

                <div class="meta-label">
                    学历要求
                </div>

                <div
                    id="education"
                    class="meta-value"
                >
                    未提供
                </div>

            </div>


            <div class="meta-item">

                <div class="meta-label">
                    实习要求
                </div>

                <div
                    id="internshipDays"
                    class="meta-value"
                >
                    未提供
                </div>

            </div>


            <div class="meta-item">

                <div class="meta-label">
                    专业要求
                </div>

                <div
                    id="major"
                    class="meta-value"
                >
                    未提供
                </div>

            </div>

        </div>


        <!-- =========================
             薪资
        ========================== -->

        <div class="salary-box">

            <div class="salary-title">
                岗位薪资
            </div>

            <div
                id="salary"
                class="salary-value"
            >
                未提供
            </div>

            <div class="salary-note">
                薪资属于岗位信息展示字段，不参与硬性条件匹配。
            </div>

        </div>


        <!-- =========================
             专业要求
        ========================== -->

        <div
            id="majorSection"
            class="section hidden"
        >

            <div class="section-title">
                专业要求
            </div>

            <div
                id="majorList"
                class="tags"
            ></div>

        </div>


        <!-- =========================
             技能要求
        ========================== -->

        <div
            id="skillsSection"
            class="section hidden"
        >

            <div class="section-title">
                技能要求
            </div>

            <div
                id="skillsList"
                class="tags"
            ></div>

        </div>


        <!-- =========================
             经验要求
        ========================== -->

        <div
            id="experienceSection"
            class="section hidden"
        >

            <div class="section-title">
                经验要求
            </div>

            <div
                id="experienceList"
                class="tags"
            ></div>

        </div>


        <!-- =========================
             岗位职责
        ========================== -->

        <div
            id="responsibilitiesSection"
            class="section hidden"
        >

            <div class="section-title">
                岗位职责
            </div>

            <ol
                id="responsibilitiesList"
                class="list"
            ></ol>

        </div>


        <!-- =========================
             其他要求
        ========================== -->

        <div
            id="otherSection"
            class="section hidden"
        >

            <div class="section-title">
                其他要求
            </div>

            <ul
                id="otherList"
                class="list"
            ></ul>

        </div>


        <!-- =========================
             US04 匹配入口
        ========================== -->

        <div class="action-box">

            <button
                type="button"
                class="match-button"
                onclick="goToMatch()"
            >
                与我的画像匹配
            </button>

        </div>


        <!-- =========================
             原始 JSON
        ========================== -->

        <div class="section">

            <div class="section-title">
                结构化数据
            </div>


            <button
                type="button"
                class="secondary"
                onclick="toggleJSON()"
            >
                查看原始 JSON
            </button>


            <pre
                id="rawJSON"
                class="hidden"
            ></pre>

        </div>

    </div>

</div>


<script>

    // =========================================================
    // 示例 JD
    // =========================================================

    const SAMPLE_JD =
`C++开发实习生
100-200元/天
广州
5天/周3个月
学历不限

职位描述
C++ QT
桌面开发经验

岗位职责:
1.使用C/C++语言进行软件开发，确保产品功能和质量。
2.与团队合作进行软件测试，确保产品达到质量标准。
3.参与软件的整体架构设计，包括界面设计和数据库交互。

任职要求:
1.熟练掌握C/C++编程语言，具备良好的编程习惯。
2.熟悉软件开发生命周期，能够使用相关工具进行开发和测试。
3.具备良好的分析和解决问题的能力，能够高效处理开发过程中的技术难题。`;


    // =========================================================
    // DOM 元素
    // =========================================================

    const jdInput =
        document.getElementById(
            "jdInput"
        );

    const parseButton =
        document.getElementById(
            "parseButton"
        );

    const statusElement =
        document.getElementById(
            "status"
        );

    const resultCard =
        document.getElementById(
            "resultCard"
        );

    const rawJSON =
        document.getElementById(
            "rawJSON"
        );


    // =========================================================
    // 填入示例 JD
    // =========================================================

    function fillSampleJD() {

        jdInput.value =
            SAMPLE_JD;


        statusElement.textContent =
            "示例 JD 已填入，可以点击“AI 解析 JD”。";

        statusElement.className =
            "success";


        jdInput.focus();

    }


    // =========================================================
    // 清空
    // =========================================================

    function clearJD() {

        jdInput.value =
            "";


        resultCard.classList.add(
            "hidden"
        );


        statusElement.textContent =
            "";

        statusElement.className =
            "";


        rawJSON.textContent =
            "";

        rawJSON.classList.add(
            "hidden"
        );


        jdInput.focus();

    }


    // =========================================================
    // 标签渲染
    // =========================================================

    function renderTags(
        elementId,
        sectionId,
        items,
        extraClass = ""
    ) {

        const element =
            document.getElementById(
                elementId
            );

        const section =
            document.getElementById(
                sectionId
            );


        element.innerHTML =
            "";


        if (
            !Array.isArray(items) ||
            items.length === 0
        ) {

            section.classList.add(
                "hidden"
            );

            return;

        }


        items.forEach(
            item => {

                const tag =
                    document.createElement(
                        "span"
                    );


                tag.className =
                    "tag " +
                    extraClass;


                tag.textContent =
                    item;


                element.appendChild(
                    tag
                );

            }
        );


        section.classList.remove(
            "hidden"
        );

    }


    // =========================================================
    // 列表渲染
    // =========================================================

    function renderList(
        elementId,
        sectionId,
        items
    ) {

        const element =
            document.getElementById(
                elementId
            );

        const section =
            document.getElementById(
                sectionId
            );


        element.innerHTML =
            "";


        if (
            !Array.isArray(items) ||
            items.length === 0
        ) {

            section.classList.add(
                "hidden"
            );

            return;

        }


        items.forEach(
            item => {

                const li =
                    document.createElement(
                        "li"
                    );


                li.textContent =
                    item;


                element.appendChild(
                    li
                );

            }
        );


        section.classList.remove(
            "hidden"
        );

    }


    // =========================================================
    // 显示解析结果
    // =========================================================

    function showResult(
        data
    ) {

        const job =
            data.job || {};


        // -----------------------------------------------------
        // 关键：保存 JD，供 US04 使用
        // -----------------------------------------------------

        sessionStorage.setItem(
            "careerpilot_job",
            JSON.stringify(job)
        );


        // -----------------------------------------------------
        // 基本信息
        // -----------------------------------------------------

        document.getElementById(
            "position"
        ).textContent =
            job.position ||
            "未识别岗位";


        document.getElementById(
            "company"
        ).textContent =
            "公司：" +
            (
                job.company ||
                "未提供"
            );


        document.getElementById(
            "location"
        ).textContent =
            job.location ||
            "未提供";


        document.getElementById(
            "education"
        ).textContent =
            job.required_education ||
            "未提供";


        document.getElementById(
            "internshipDays"
        ).textContent =
            job.internship_days ||
            "未提供";


        // -----------------------------------------------------
        // 专业要求摘要
        // -----------------------------------------------------

        if (
            Array.isArray(
                job.required_major
            ) &&
            job.required_major.length > 0
        ) {

            document.getElementById(
                "major"
            ).textContent =
                job.required_major.join(
                    "、"
                );

        } else {

            document.getElementById(
                "major"
            ).textContent =
                "未提供";
        }


        // -----------------------------------------------------
        // 薪资
        // -----------------------------------------------------

        document.getElementById(
            "salary"
        ).textContent =
            job.salary ||
            "未提供";


        // -----------------------------------------------------
        // 专业
        // -----------------------------------------------------

        renderTags(
            "majorList",
            "majorSection",
            job.required_major
        );


        // -----------------------------------------------------
        // 技能
        // -----------------------------------------------------

        renderTags(
            "skillsList",
            "skillsSection",
            job.required_skills
        );


        // -----------------------------------------------------
        // 经验
        // -----------------------------------------------------

        renderTags(
            "experienceList",
            "experienceSection",
            job.experience,
            "orange"
        );


        // -----------------------------------------------------
        // 岗位职责
        // -----------------------------------------------------

        renderList(
            "responsibilitiesList",
            "responsibilitiesSection",
            job.responsibilities
        );


        // -----------------------------------------------------
        // 其他要求
        // -----------------------------------------------------

        renderList(
            "otherList",
            "otherSection",
            job.other_requirements
        );


        // -----------------------------------------------------
        // 原始 JSON
        // -----------------------------------------------------

        rawJSON.textContent =
            JSON.stringify(
                job,
                null,
                2
            );


        rawJSON.classList.add(
            "hidden"
        );


        // -----------------------------------------------------
        // 显示结果
        // -----------------------------------------------------

        resultCard.classList.remove(
            "hidden"
        );


        resultCard.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }


    // =========================================================
    // AI 解析 JD
    // =========================================================

    async function parseJD() {

        const jdText =
            jdInput.value.trim();


        // -----------------------------------------------------
        // 输入检查
        // -----------------------------------------------------

        if (!jdText) {

            statusElement.textContent =
                "请先输入岗位 JD。";

            statusElement.className =
                "error";

            return;

        }


        if (
            jdText.length < 30
        ) {

            statusElement.textContent =
                "JD 内容过短，请输入完整岗位描述。";

            statusElement.className =
                "error";

            return;

        }


        // -----------------------------------------------------
        // 加载状态
        // -----------------------------------------------------

        parseButton.disabled =
            true;


        statusElement.textContent =
            "正在调用 AI 解析 JD，请稍候……";

        statusElement.className =
            "loading";


        try {

            // -------------------------------------------------
            // 调用后端
            // -------------------------------------------------

            const response =
                await fetch(
                    "/api/jd/parse",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body: JSON.stringify({
                            jd_text:
                                jdText
                        })
                    }
                );


            const data =
                await response.json();


            // -------------------------------------------------
            // 错误处理
            // -------------------------------------------------

            if (
                !response.ok
            ) {

                throw new Error(
                    data.detail ||
                    "JD 解析失败。"
                );

            }


            // -------------------------------------------------
            // 展示结果
            // -------------------------------------------------

            showResult(
                data
            );


            statusElement.textContent =
                "JD 解析成功。";

            statusElement.className =
                "success";


        } catch (error) {

            console.error(
                "JD 解析错误：",
                error
            );


            statusElement.textContent =
                "解析失败：" +
                error.message;

            statusElement.className =
                "error";


        } finally {

            parseButton.disabled =
                false;

        }

    }


    // =========================================================
    // 查看 / 隐藏 JSON
    // =========================================================

    function toggleJSON() {

        const isHidden =
            rawJSON.classList.contains(
                "hidden"
            );


        if (isHidden) {

            rawJSON.classList.remove(
                "hidden"
            );

        } else {

            rawJSON.classList.add(
                "hidden"
            );

        }

    }


    // =========================================================
    // 前往 US04
    // =========================================================

    function goToMatch() {

        const savedJob =
            sessionStorage.getItem(
                "careerpilot_job"
            );


        if (!savedJob) {

            statusElement.textContent =
                "当前没有可匹配的岗位，请先完成 JD 解析。";

            statusElement.className =
                "error";

            return;

        }


        window.location.href =
            "/match";

    }

</script>

</body>

</html>
