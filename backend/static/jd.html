<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JD 解析 - CareerPilot AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 32px 0 60px;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #111827;
        }

        .header p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;

            box-shadow:
                0 4px 16px rgba(
                    15,
                    23,
                    42,
                    0.06
                );
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 20px;
            color: #111827;
        }

        textarea {
            width: 100%;
            min-height: 320px;

            resize: vertical;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            padding: 16px;

            font-size: 14px;
            line-height: 1.7;

            font-family:

                BlinkMacSystemFont,

            outline: none;
        }

                    0.10
                );
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        button {

            border-radius: 10px;

            padding: 11px 18px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:

        }

        button:hover {

            opacity: 0.92;
        }

        button.primary {

        }

        button.secondary {

        }

        button.success {
            background: #059669;
            color: white;
        }

        button:disabled {

            opacity: 0.55;
            transform: none;
        }

        .sample-box {
            margin-top: 12px;

            padding: 12px 14px;

            background: #f8fafc;

            border-radius: 10px;

            color: #6b7280;

            font-size: 13px;

            line-height: 1.6;
        }

        .error {
            padding: 16px;
            border-radius: 12px;

            background: #fef2f2;
            border: 1px solid #fecaca;

            color: #991b1b;

            margin-bottom: 20px;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .success-message {
            padding: 14px 16px;
            border-radius: 12px;

            background: #ecfdf5;
            border: 1px solid #a7f3d0;

            color: #166534;

            margin-bottom: 20px;
        }

        .loading {
            display: none;

            padding: 30px 20px;

            text-align: center;

            color: #6b7280;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 20px;

            flex-wrap: wrap;
        }

        .job-title {
            margin: 0;

            font-size: 26px;

            color: #111827;
        }

        .company {
            margin-top: 8px;

            color: #6b7280;
        }

        .salary {
            padding: 10px 16px;

            border-radius: 10px;

            background: #fff7ed;

            color: #c2410c;

            font-weight: 700;

            white-space: nowrap;
        }

        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap: 14px;

            margin-top: 22px;
        }

        .info-item {
            padding: 14px;

            background: #f8fafc;

            border-radius: 10px;
        }

        .info-label {
            margin-bottom: 5px;

            color: #6b7280;

            font-size: 13px;
        }

        .info-value {
            color: #111827;

            font-size: 15px;

            line-height: 1.6;

            word-break: break-word;
        }

        .section {
            margin-top: 22px;
        }

        .section-title {
            margin-bottom: 10px;

            font-size: 16px;

            font-weight: 700;

            color: #111827;
        }

        ul {
            margin: 0;

            padding-left: 22px;
        }

        li {
            margin-bottom: 8px;

            line-height: 1.7;
        }

        .tag-list {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;
        }

        .tag {
            display: inline-block;

            padding: 6px 10px;

            border-radius: 999px;

            background: #eef2ff;

            color: #4338ca;

            font-size: 13px;
        }

        .empty {
            color: #9ca3af;

            font-size: 14px;
        }

        .raw-json {
            margin-top: 20px;
        }

        .raw-json summary {
            cursor: pointer;

            color: #2563eb;

            font-size: 14px;
        }

        .raw-json pre {
            margin-top: 12px;

            padding: 16px;

            background: #111827;

            color: #e5e7eb;

            border-radius: 10px;

            overflow-x: auto;

            font-size: 12px;

            line-height: 1.6;
        }

        @media (max-width: 768px) {

            .container {
                width: 94%;

                padding-top: 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .job-title {
                font-size: 22px;
            }

            textarea {
                min-height: 260px;
            }
        }
    </style>
</head>


<body>

<script>

    // ========================================================
    // 全局变量
    // ========================================================

    let currentJob = null;


    // ========================================================
    // HTML 转义
    // ========================================================

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    // ========================================================
    // 数组标准化
    // ========================================================

    function normalizeArray(value) {

        if (Array.isArray(value)) {
            return value;
        }

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return [];
        }

        return [value];
    }


    // ========================================================
    // 格式化普通数组
    // ========================================================

    function formatArray(
        value,
        separator = "、"
    ) {

        const arr =
            normalizeArray(value);

        if (
            arr.length === 0
        ) {
            return "暂无信息";
        }

        return arr
            .map(
                item => {

                    if (
                        typeof item ===
                        "object"
                    ) {
                        return JSON.stringify(
                            item,
                            null,
                            2
                        );
                    }

                    return String(item);
                }
            )
            .map(
                item =>
                    escapeHtml(item)
            )
            .join(separator);
    }


    // ========================================================
    // 渲染列表
    // ========================================================

    function renderList(
        elementId,
        value,
        emptyText = "暂无信息"
    ) {

        const container =
            document.getElementById(
                elementId
            );

        const arr =
            normalizeArray(value);

        if (
            arr.length === 0
        ) {

            container.innerHTML =
                `
                <div class="empty">
                    ${escapeHtml(
                        emptyText
                    )}
                </div>
                `;

            return;
        }


        container.innerHTML =
            `
            <ul>
                ${
                    arr
                        .map(
                            item => {

                                let text;

                                if (
                                    typeof item ===
                                    "object"
                                ) {

                                    text =
                                        JSON.stringify(
                                            item
                                        );

                                } else {

                                    text =
                                        String(item);
                                }

                                return `
                                    <li>
                                        ${escapeHtml(text)}
                                    </li>
                                `;
                            }
                        )
                        .join("")
                }
            </ul>
            `;
    }


    // ========================================================
    // 渲染岗位信息
    // ========================================================

    function renderJob(
        job
    ) {

        currentJob = job;


        // ----------------------------------------------------
        // 岗位基本信息
        // ----------------------------------------------------

        document.getElementById(
            "jobPosition"
        ).textContent =
            job.position ||
            "未提供岗位名称";


        document.getElementById(
            "jobCompany"
        ).textContent =
            job.company ||
            "未提供公司名称";


        document.getElementById(
            "jobSalary"
        ).textContent =
            job.salary ||
            "薪资未提供";


        document.getElementById(
            "jobLocation"
        ).textContent =
            job.location ||
            "未提供";


        document.getElementById(
            "jobEducation"
        ).textContent =
            job.required_education ||
            "未提供";


        document.getElementById(
            "jobMajor"
        ).innerHTML =
            formatArray(
                job.required_major
            );


        document.getElementById(
            "jobInternshipDays"
        ).textContent =
            job.internship_days ||
            "未提供";


        // ----------------------------------------------------
        // 技能
        // ----------------------------------------------------

        const skills =
            normalizeArray(
                job.required_skills
            );


        const skillContainer =
            document.getElementById(
                "jobSkills"
            );


        if (
            skills.length === 0
        ) {

            skillContainer.innerHTML =
                `
                <span class="empty">
                    暂无明确技能要求
                </span>
                `;

        } else {

            skillContainer.innerHTML =
                skills
                    .map(
                        skill =>
                            `
                            <span class="tag">
                                ${escapeHtml(
                                    typeof skill ===
                                    "object"
                                        ? JSON.stringify(skill)
                                        : skill
                                )}
                            </span>
                            `
                    )
                    .join("");
        }


        // ----------------------------------------------------
        // 岗位职责
        // ----------------------------------------------------

        renderList(
            "jobResponsibilities",
            job.responsibilities,
            "暂无明确岗位职责"
        );


        // ----------------------------------------------------
        // 经验要求
        // ----------------------------------------------------

        renderList(
            "jobExperience",
            job.experience,
            "暂无明确经验要求"
        );


        // ----------------------------------------------------
        // 其他要求
        // ----------------------------------------------------

        renderList(
            "jobOtherRequirements",
            job.other_requirements,
            "暂无其他要求"
        );


        // ----------------------------------------------------
        // 原始 JSON
        // ----------------------------------------------------

        document.getElementById(
            "rawJson"
        ).textContent =
            JSON.stringify(
                job,
                null,
                2
            );


        // ----------------------------------------------------
        // 显示结果
        // ----------------------------------------------------

        document.getElementById(
            "resultCard"
        ).style.display =
            "block";
    }


    // ========================================================
    // 解析 JD
    // ========================================================

    async function parseJD() {

        const text =
            document.getElementById(
                "jdText"
            ).value.trim();


        // ----------------------------------------------------
        // 清除旧提示
        // ----------------------------------------------------

        hideError();
        hideSuccess();


        // ----------------------------------------------------
        // 检查输入
        // ----------------------------------------------------

        if (!text) {

            showError(
                "请输入岗位 JD。"
            );

            return;
        }


        if (
            text.length < 10
        ) {

            showError(
                "岗位描述内容过短，请输入更完整的 JD。"
            );

            return;
        }


        // ----------------------------------------------------
        // 开始 Loading
        // ----------------------------------------------------

        setLoading(
            true
        );


        try {

            const response =
                await fetch(
                    "/api/jd/parse",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            text: text
                        })
                    }
                );


            // ------------------------------------------------
            // 尝试解析 JSON
            // ------------------------------------------------

            let data;

            try {

                data =
                    await response.json();

            } catch (jsonError) {

                throw new Error(
                    "服务器返回的内容不是有效 JSON。"
                );
            }


            // ------------------------------------------------
            // 处理 HTTP 错误
            //
            // 这里专门解决：
            // [object Object]
            // ------------------------------------------------

            if (
                !response.ok
            ) {

                let errorMessage =
                    "JD 解析失败。";


                if (
                    typeof data.detail ===
                    "string"
                ) {

                    errorMessage =
                        data.detail;

                } else if (
                    data.detail
                ) {

                    errorMessage =
                        JSON.stringify(
                            data.detail,
                            null,
                            2
                        );

                } else {

                    errorMessage =
                        JSON.stringify(
                            data,
                            null,
                            2
                        );
                }


                throw new Error(
                    errorMessage
                );
            }


            // ------------------------------------------------
            // 获取岗位结果
            // ------------------------------------------------

            const job =
                data.job;


            if (
                !job ||
                typeof job !==
                "object"
            ) {

                throw new Error(
                    "服务器返回成功，但没有获得有效的岗位结构化结果。"
                );
            }


            // ------------------------------------------------
            // 保存当前岗位
            // ------------------------------------------------

            currentJob =
                job;


            sessionStorage.setItem(
                "careerpilot_job",
                JSON.stringify(job)
            );


            // ------------------------------------------------
            // 显示结果
            // ------------------------------------------------

            renderJob(
                job
            );


            showSuccess(
                "JD 解析成功，岗位信息已经保存。"
            );


            // ------------------------------------------------
            // 滚动到结果区域
            // ------------------------------------------------

            document.getElementById(
                "resultCard"
            ).scrollIntoView({
                behavior: "smooth"
            });


        } catch (error) {

            console.error(
                "JD 解析失败：",
                error
            );


            let message;


            if (
                error instanceof Error
            ) {

                message =
                    error.message;

            } else if (
                typeof error ===
                "string"
            ) {

                message =
                    error;

            } else {

                try {

                    message =
                        JSON.stringify(
                            error,
                            null,
                            2
                        );

                } catch {
                    message =
                        "发生未知错误。";
                }
            }


            showError(
                "解析失败：\n" +
                message
            );


        } finally {

            setLoading(
                false
            );
        }
    }


    // ========================================================
    // 使用示例 JD
    // ========================================================

    function fillSampleJD() {

        const sampleJD =
`C++开发实习生
100-200元/天
广州
5天/周3个月
学历不限

职位描述
C++ QT
桌面开发经验

岗位职责:
1. 使用C/C++语言进行软件开发，确保产品功能和质量。
2. 与团队合作进行软件测试，确保产品达到质量标准。
3. 参与软件的整体架构设计，包括界面设计和数据库交互。

任职要求:
1. 熟练掌握C/C++编程语言，具备良好的编程习惯。
2. 熟悉软件开发生命周期，能够使用相关工具进行开发和测试。
3. 具备良好的分析和解决问题的能力，能够高效处理开发过程中的技术难题。`;


        document.getElementById(
            "jdText"
        ).value =
            sampleJD;


        hideError();
        hideSuccess();
    }


    // ========================================================
    // 清空 JD
    // ========================================================

    function clearJD() {

        document.getElementById(
            "jdText"
        ).value =
            "";


        document.getElementById(
            "resultCard"
        ).style.display =
            "none";


        hideError();
        hideSuccess();

        currentJob =
            null;
    }


    // ========================================================
    // 进入岗位匹配
    // ========================================================

    function goToMatch() {

        const savedJob =
            sessionStorage.getItem(
                "careerpilot_job"
            );


        if (
            !savedJob
        ) {

            if (
                currentJob
            ) {

                sessionStorage.setItem(
                    "careerpilot_job",
                    JSON.stringify(
                        currentJob
                    )
                );

            } else {

                showError(
                    "当前没有可用岗位信息，请先完成 JD 解析。"
                );

                return;
            }
        }


        window.location.href =
            "/match";
    }


    // ========================================================
    // Loading 控制
    // ========================================================

    function setLoading(
        loading
    ) {

        const loadingBox =
            document.getElementById(
                "loading"
            );


        const button =
            document.getElementById(
                "parseButton"
            );


        if (
            loading
        ) {

            loadingBox.style.display =
                "block";

            button.disabled =
                true;

            button.textContent =
                "正在解析...";

        } else {

            loadingBox.style.display =
                "none";

            button.disabled =
                false;

            button.textContent =
                "解析 JD";
        }
    }


    // ========================================================
    // 显示错误
    // ========================================================

    function showError(
        message
    ) {

        const box =
            document.getElementById(
                "errorBox"
            );


        box.textContent =
            message;


        box.style.display =
            "block";


        box.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }


    // ========================================================
    // 隐藏错误
    // ========================================================

    function hideError() {

        const box =
            document.getElementById(
                "errorBox"
            );


        box.textContent =
            "";

        box.style.display =
            "none";
    }


    // ========================================================
    // 显示成功
    // ========================================================

    function showSuccess(
        message
    ) {

        const box =
            document.getElementById(
                "successBox"
            );


        box.textContent =
            message;


        box.className =
            "success-message";


        box.style.display =
            "block";
    }


    // ========================================================
    // 隐藏成功
    // ========================================================

    function hideSuccess() {

        const box =
            document.getElementById(
                "successBox"
            );


        box.textContent =
            "";

        box.style.display =
            "none";
    }


    // ========================================================
    // 页面初始化
    // ========================================================

    function init() {

        const savedJob =
            sessionStorage.getItem(
                "careerpilot_job"
            );


        if (!savedJob) {
            return;
        }


        try {

            const job =
                JSON.parse(
                    savedJob
                );


            if (
                job &&
                typeof job ===
                "object"
            ) {

                currentJob =
                    job;

                renderJob(
                    job
                );
            }

        } catch (error) {

            console.warn(
                "读取已保存岗位信息失败：",
                error
            );

            sessionStorage.removeItem(
                "careerpilot_job"
            );
        }
    }


    // ========================================================
    // 页面启动
    // ========================================================

    init();

</script>

</body>
</html>
