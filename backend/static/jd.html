<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerPilot AI - JD解析</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 28px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            min-height: 320px;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            resize: vertical;
            font-size: 14px;
            line-height: 1.7;
            font-family: inherit;
            outline: none;
        }

        textarea:focus {
            border-color: #4f46e5;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        .primary {
            background: #4f46e5;
            color: white;
        }

        .primary:hover {
            background: #4338ca;
        }

        .secondary {
            background: #eef2ff;
            color: #4338ca;
        }

        .secondary:hover {
            background: #e0e7ff;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            min-height: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .success {
            color: #15803d !important;
        }

        .error {
            color: #dc2626 !important;
        }

        .hidden {
            display: none !important;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 20px;
            margin-bottom: 20px;
            gap: 20px;
        }

        .position {
            font-size: 28px;
            margin: 0 0 8px;
        }

        .company {
            color: #6b7280;
        }

        .badge {
            background: #ecfdf5;
            color: #047857;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .meta-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
        }

        .meta-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 7px;
        }

        .meta-value {
            font-weight: 600;
        }

        .section {
            margin-top: 26px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: #eef2ff;
            color: #4338ca;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 13px;
        }

        .tag.orange {
            background: #fff7ed;
            color: #c2410c;
        }

        ol,
        ul {
            margin: 0;
            padding-left: 24px;
        }

        li {
            margin-bottom: 9px;
            line-height: 1.7;
            font-size: 14px;
        }

        pre {
            background: #111827;
            color: #e5e7eb;
            padding: 16px;
            border-radius: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 800px) {
            .meta-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 24px 14px;
            }

            .meta-grid {
                grid-template-columns: 1fr;
            }

            .result-header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CareerPilot AI</h1>
    <div class="subtitle">
        US03：岗位 JD 输入与结构化解析
    </div>

    <!-- JD输入 -->
    <div class="card">

        <h2>输入岗位 JD</h2>

        <textarea
            id="jdInput"
            placeholder="请把招聘网站上的完整岗位 JD 粘贴到这里……"
        ></textarea>

        <div class="buttons">

            <button
                type="button"
                class="primary"
                id="parseButton"
                onclick="parseJD()"
            >
                AI 解析 JD
            </button>

            <button
                type="button"
                class="secondary"
                onclick="fillSampleJD()"
            >
                填入示例 JD
            </button>

            <button
                type="button"
                class="secondary"
                onclick="clearJD()"
            >
                清空
            </button>

        </div>

        <div id="status"></div>

    </div>


    <!-- 结果卡片 -->
    <div
        id="resultCard"
        class="card hidden"
    >

        <div class="result-header">

            <div>
                <h2
                    id="position"
                    class="position"
                >
                    未识别岗位
                </h2>

                <div
                    id="company"
                    class="company"
                >
                    公司：未提供
                </div>
            </div>

            <div class="badge">
                AI 结构化解析
            </div>

        </div>


        <!-- 基本信息 -->
        <div class="meta-grid">

            <div class="meta-item">
                <div class="meta-label">
                    工作地点
                </div>

                <div
                    id="location"
                    class="meta-value"
                >
                    未提供
                </div>
            </div>

            <div class="meta-item">
                <div class="meta-label">
                    学历要求
                </div>

                <div
                    id="education"
                    class="meta-value"
                >
                    未提供
                </div>
            </div>

            <div class="meta-item">
                <div class="meta-label">
                    实习要求
                </div>

                <div
                    id="internshipDays"
                    class="meta-value"
                >
                    未提供
                </div>
            </div>

            <div class="meta-item">
                <div class="meta-label">
                    JD 文本长度
                </div>

                <div
                    id="textLength"
                    class="meta-value"
                >
                    0 字
                </div>
            </div>

        </div>


        <!-- 专业 -->
        <div
            id="majorSection"
            class="section hidden"
        >

            <div class="section-title">
                专业要求
            </div>

            <div
                id="majorList"
                class="tags"
            ></div>

        </div>


        <!-- 技能 -->
        <div
            id="skillsSection"
            class="section hidden"
        >

            <div class="section-title">
                技能要求
            </div>

            <div
                id="skillsList"
                class="tags"
            ></div>

        </div>


        <!-- 经验 -->
        <div
            id="experienceSection"
            class="section hidden"
        >

            <div class="section-title">
                经验要求
            </div>

            <div
                id="experienceList"
                class="tags"
            ></div>

        </div>


        <!-- 岗位职责 -->
        <div
            id="responsibilitiesSection"
            class="section hidden"
        >

            <div class="section-title">
                岗位职责
            </div>

            <ol id="responsibilitiesList"></ol>

        </div>


        <!-- 其他要求 -->
        <div
            id="otherSection"
            class="section hidden"
        >

            <div class="section-title">
                其他要求
            </div>

            <ul id="otherList"></ul>

        </div>


        <!-- JSON -->
        <div class="section">

            <div class="section-title">
                结构化数据
            </div>

            <button
                type="button"
                class="secondary"
                onclick="toggleJSON()"
            >
                查看原始 JSON
            </button>

            <pre
                id="rawJSON"
                class="hidden"
            ></pre>

        </div>

    </div>

</div>


<script>

    // =========================
    // 示例 JD
    // =========================

    const SAMPLE_JD =
`C++开发实习生
100-200元/天
广州
5天/周3个月
学历不限

职位描述
C++ QT
桌面开发经验

岗位职责:
1.使用C/C++语言进行软件开发，确保产品功能和质量。
2.与团队合作进行软件测试，确保产品达到质量标准。
3.参与软件的整体架构设计，包括界面设计和数据库交互。

任职要求:
1.熟练掌握C/C++编程语言，具备良好的编程习惯。
2.熟悉软件开发生命周期，能够使用相关工具进行开发和测试。
3.具备良好的分析和解决问题的能力，能够高效处理开发过程中的技术难题。`;


    // =========================
    // 填入示例
    // =========================

    function fillSampleJD() {

        const input =
            document.getElementById("jdInput");

        const status =
            document.getElementById("status");

        input.value = SAMPLE_JD;

        status.textContent =
            "示例 JD 已填入，可以点击“AI 解析 JD”。";

        status.className = "success";

        input.focus();
    }


    // =========================
    // 清空
    // =========================

    function clearJD() {

        document.getElementById(
            "jdInput"
        ).value = "";

        document.getElementById(
            "resultCard"
        ).classList.add("hidden");

        const status =
            document.getElementById("status");

        status.textContent = "";

        status.className = "";

        document.getElementById(
            "jdInput"
        ).focus();
    }


    // =========================
    // 标签渲染
    // =========================

    function renderTags(
        elementId,
        sectionId,
        items,
        extraClass = ""
    ) {

        const element =
            document.getElementById(elementId);

        const section =
            document.getElementById(sectionId);

        element.innerHTML = "";

        if (
            !Array.isArray(items) ||
            items.length === 0
        ) {

            section.classList.add("hidden");

            return;
        }

        items.forEach(
            item => {

                const tag =
                    document.createElement("span");

                tag.className =
                    "tag " + extraClass;

                tag.textContent =
                    item;

                element.appendChild(tag);
            }
        );

        section.classList.remove("hidden");
    }


    // =========================
    // 列表渲染
    // =========================

    function renderList(
        elementId,
        sectionId,
        items
    ) {

        const element =
            document.getElementById(elementId);

        const section =
            document.getElementById(sectionId);

        element.innerHTML = "";

        if (
            !Array.isArray(items) ||
            items.length === 0
        ) {

            section.classList.add("hidden");

            return;
        }

        items.forEach(
            item => {

                const li =
                    document.createElement("li");

                li.textContent =
                    item;

                element.appendChild(li);
            }
        );

        section.classList.remove("hidden");
    }


    // =========================
    // 显示解析结果
    // =========================

    function showResult(data) {

        const job =
            data.job || {};


        document.getElementById(
            "position"
        ).textContent =
            job.position || "未识别岗位";


        document.getElementById(
            "company"
        ).textContent =
            "公司：" +
            (job.company || "未提供");


        document.getElementById(
            "location"
        ).textContent =
            job.location || "未提供";


        document.getElementById(
            "education"
        ).textContent =
            job.required_education || "未提供";


        document.getElementById(
            "internshipDays"
        ).textContent =
            job.internship_days || "未提供";


        document.getElementById(
            "textLength"
        ).textContent =
            (data.text_length || 0) + " 字";


        renderTags(
            "majorList",
            "majorSection",
            job.required_major
        );


        renderTags(
            "skillsList",
            "skillsSection",
            job.required_skills
        );


        renderTags(
            "experienceList",
            "experienceSection",
            job.experience,
            "orange"
        );


        renderList(
            "responsibilitiesList",
            "responsibilitiesSection",
            job.responsibilities
        );


        renderList(
            "otherList",
            "otherSection",
            job.other_requirements
        );


        document.getElementById(
            "rawJSON"
        ).textContent =
            JSON.stringify(
                job,
                null,
                2
            );


        document.getElementById(
            "rawJSON"
        ).classList.add("hidden");


        document.getElementById(
            "resultCard"
        ).classList.remove("hidden");


        document.getElementById(
            "resultCard"
        ).scrollIntoView({
            behavior: "smooth"
        });
    }


    // =========================
    // 调用后端解析 JD
    // =========================

    async function parseJD() {

        const input =
            document.getElementById("jdInput");

        const button =
            document.getElementById("parseButton");

        const status =
            document.getElementById("status");

        const jdText =
            input.value.trim();


        if (!jdText) {

            status.textContent =
                "请先输入岗位 JD。";

            status.className =
                "error";

            return;
        }


        if (jdText.length < 30) {

            status.textContent =
                "JD 内容过短，请输入完整岗位描述。";

            status.className =
                "error";

            return;
        }


        button.disabled = true;

        status.textContent =
            "正在调用 AI 解析 JD，请稍候……";

        status.className = "";


        try {

            const response =
                await fetch(
                    "/api/jd/parse",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body: JSON.stringify({
                            jd_text: jdText
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "JD 解析失败"
                );
            }


            showResult(data);


            status.textContent =
                "JD 解析成功。";

            status.className =
                "success";


        } catch (error) {

            console.error(
                "JD解析错误：",
                error
            );

            status.textContent =
                "解析失败：" +
                error.message;

            status.className =
                "error";

        } finally {

            button.disabled = false;
        }

    }


    // =========================
    // 显示 / 隐藏 JSON
    // =========================

    function toggleJSON() {

        const json =
            document.getElementById(
                "rawJSON"
            );

        const hidden =
            json.classList.contains(
                "hidden"
            );

        if (hidden) {

            json.classList.remove(
                "hidden"
            );

        } else {

            json.classList.add(
                "hidden"
            );
        }
    }

</script>

</body>
</html>
