<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerPilot AI - JD解析</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                Arial,
                sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .header p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
            border: 1px solid #e5e7eb;
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 20px;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            resize: vertical;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            line-height: 1.7;
            font-family: inherit;
        }

        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }

        .primary-btn {
            background: #4f46e5;
            color: white;
        }

        .primary-btn:hover {
            background: #4338ca;
        }

        .secondary-btn {
            background: #eef2ff;
            color: #4338ca;
        }

        .secondary-btn:hover {
            background: #e0e7ff;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 14px;
            min-height: 24px;
            color: #6b7280;
            font-size: 14px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .position {
            margin: 0 0 10px;
            font-size: 28px;
            color: #111827;
        }

        .company {
            color: #6b7280;
            font-size: 15px;
        }

        .ai-badge {
            white-space: nowrap;
            background: #ecfdf5;
            color: #047857;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .meta-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
        }

        .meta-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .meta-value {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            word-break: break-word;
        }

        .section {
            margin-top: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111827;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            padding: 7px 11px;
            border-radius: 999px;
            font-size: 13px;
        }

        .tag.green {
            background: #ecfdf5;
            color: #047857;
        }

        .tag.orange {
            background: #fff7ed;
            color: #c2410c;
        }

        .list {
            margin: 0;
            padding-left: 22px;
        }

        .list li {
            margin: 8px 0;
            line-height: 1.7;
            font-size: 14px;
        }

        .empty {
            color: #9ca3af;
            font-size: 14px;
        }

        .raw-json {
            background: #111827;
            color: #e5e7eb;
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 12px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 800px) {
            .meta-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .result-header {
                flex-direction: column;
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 24px 14px 40px;
            }

            .meta-grid {
                grid-template-columns: 1fr;
            }

            .position {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 页面标题 -->
    <div class="header">
        <h1>CareerPilot AI</h1>
        <p>US03：岗位 JD 输入与结构化解析</p>
    </div>


    <!-- JD 输入 -->
    <div class="card">
        <h2>输入岗位 JD</h2>

        <textarea
            id="jdInput"
            placeholder="请粘贴完整岗位 JD，例如：岗位名称、薪资、地点、岗位职责、任职要求等..."
        ></textarea>

        <div class="toolbar">
            <button
                id="parseButton"
                class="primary-btn"
            >
                AI 解析 JD
            </button>

            <button
                id="sampleButton"
                class="secondary-btn"
            >
                填入示例 JD
            </button>

            <button
                id="clearButton"
                class="secondary-btn"
            >
                清空
            </button>
        </div>

        <div
            id="status"
            class="status"
        ></div>
    </div>


    <!-- JD 结果 -->
    <div
        id="resultCard"
        class="card hidden"
    >

        <div class="result-header">

            <div>
                <h2
                    id="position"
                    class="position"
                >
                    -
                </h2>

                <div
                    id="company"
                    class="company"
                >
                    公司：未提供
                </div>
            </div>

            <div class="ai-badge">
                AI 结构化解析
            </div>

        </div>


        <!-- 基本信息 -->
        <div class="meta-grid">

            <div class="meta-item">
                <div class="meta-label">
                    工作地点
                </div>

                <div
                    id="location"
                    class="meta-value"
                >
                    -
                </div>
            </div>


            <div class="meta-item">
                <div class="meta-label">
                    学历要求
                </div>

                <div
                    id="education"
                    class="meta-value"
                >
                    -
                </div>
            </div>


            <div class="meta-item">
                <div class="meta-label">
                    实习要求
                </div>

                <div
                    id="internshipDays"
                    class="meta-value"
                >
                    -
                </div>
            </div>


            <div class="meta-item">
                <div class="meta-label">
                    文本长度
                </div>

                <div
                    id="textLength"
                    class="meta-value"
                >
                    -
                </div>
            </div>

        </div>


        <!-- 专业要求 -->
        <div
            id="majorSection"
            class="section hidden"
        >
            <div class="section-title">
                专业要求
            </div>

            <div
                id="majorList"
                class="tag-list"
            ></div>
        </div>


        <!-- 技能要求 -->
        <div
            id="skillsSection"
            class="section hidden"
        >
            <div class="section-title">
                技能要求
            </div>

            <div
                id="skillsList"
                class="tag-list"
            ></div>
        </div>


        <!-- 经验要求 -->
        <div
            id="experienceSection"
            class="section hidden"
        >
            <div class="section-title">
                经验要求
            </div>

            <div
                id="experienceList"
                class="tag-list"
            ></div>
        </div>


        <!-- 岗位职责 -->
        <div
            id="responsibilitiesSection"
            class="section hidden"
        >
            <div class="section-title">
                岗位职责
            </div>

            <ol
                id="responsibilitiesList"
                class="list"
            ></ol>
        </div>


        <!-- 其他要求 -->
        <div
            id="otherSection"
            class="section hidden"
        >
            <div class="section-title">
                其他要求
            </div>

            <ul
                id="otherList"
                class="list"
            ></ul>
        </div>


        <!-- 原始 JSON -->
        <div class="section">
            <div class="section-title">
                结构化数据
            </div>

            <button
                id="toggleJsonButton"
                class="secondary-btn"
            >
                查看原始 JSON
            </button>

            <pre
                id="rawJson"
                class="raw-json hidden"
            ></pre>
        </div>

    </div>

</div>


<script>

    const jdInput = document.getElementById("jdInput");
    const parseButton = document.getElementById("parseButton");
    const sampleButton = document.getElementById("sampleButton");
    const clearButton = document.getElementById("clearButton");
    const status = document.getElementById("status");

    const resultCard = document.getElementById("resultCard");

    const position = document.getElementById("position");
    const company = document.getElementById("company");

    const location = document.getElementById("location");
    const education = document.getElementById("education");
    const internshipDays = document.getElementById("internshipDays");
    const textLength = document.getElementById("textLength");

    const majorSection = document.getElementById("majorSection");
    const majorList = document.getElementById("majorList");

    const skillsSection = document.getElementById("skillsSection");
    const skillsList = document.getElementById("skillsList");

    const experienceSection = document.getElementById("experienceSection");
    const experienceList = document.getElementById("experienceList");

    const responsibilitiesSection =
        document.getElementById(
            "responsibilitiesSection"
        );

    const responsibilitiesList =
        document.getElementById(
            "responsibilitiesList"
        );

    const otherSection =
        document.getElementById(
            "otherSection"
        );

    const otherList =
        document.getElementById(
            "otherList"
        );

    const toggleJsonButton =
        document.getElementById(
            "toggleJsonButton"
        );

    const rawJson =
        document.getElementById(
            "rawJson"
        );


    // 示例 JD
    const sampleJD =
`C++开发实习生
100-200元/天
广州
5天/周3个月
学历不限

职位描述
C++ QT
桌面开发经验

岗位职责:
1.使用C/C++语言进行软件开发，确保产品功能和质量。
2.与团队合作进行软件测试，确保产品达到质量标准。
3.参与软件的整体架构设计，包括界面设计和数据库交互。

任职要求:
1.熟练掌握C/C++编程语言，具备良好的编程习惯。
2.熟悉软件开发生命周期，能够使用相关工具进行开发和测试。
3.具备良好的分析和解决问题的能力，能够高效处理开发过程中的技术难题。`;


    // 创建标签
    function renderTags(
        container,
        items,
        className = ""
    ) {

        container.innerHTML = "";

        if (!Array.isArray(items) || items.length === 0) {
            return false;
        }

        items.forEach(item => {

            const span =
                document.createElement("span");

            span.className =
                `tag ${className}`;

            span.textContent = item;

            container.appendChild(span);
        });

        return true;
    }


    // 创建列表
    function renderList(
        container,
        items
    ) {

        container.innerHTML = "";

        if (!Array.isArray(items) || items.length === 0) {
            return false;
        }

        items.forEach(item => {

            const li =
                document.createElement("li");

            li.textContent = item;

            container.appendChild(li);
        });

        return true;
    }


    // 显示结果
    function renderJobResult(
        data
    ) {

        const job = data.job || {};

        // 基本信息
        position.textContent =
            job.position || "未识别岗位";

        company.textContent =
            `公司：${job.company || "未提供"}`;

        location.textContent =
            job.location || "未提供";

        education.textContent =
            job.required_education || "未提供";

        internshipDays.textContent =
            job.internship_days || "未提供";

        textLength.textContent =
            `${data.text_length || 0} 字`;


        // 专业
        const hasMajor =
            renderTags(
                majorList,
                job.required_major,
                ""
            );

        majorSection.classList.toggle(
            "hidden",
            !hasMajor
        );


        // 技能
        const hasSkills =
            renderTags(
                skillsList,
                job.required_skills,
                ""
            );

        skillsSection.classList.toggle(
            "hidden",
            !hasSkills
        );


        // 经验
        const hasExperience =
            renderTags(
                experienceList,
                job.experience,
                "orange"
            );

        experienceSection.classList.toggle(
            "hidden",
            !hasExperience
        );


        // 岗位职责
        const hasResponsibilities =
            renderList(
                responsibilitiesList,
                job.responsibilities
            );

        responsibilitiesSection.classList.toggle(
            "hidden",
            !hasResponsibilities
        );


        // 其他要求
        const hasOther =
            renderList(
                otherList,
                job.other_requirements
            );

        otherSection.classList.toggle(
            "hidden",
            !hasOther
        );


        // 原始 JSON
        rawJson.textContent =
            JSON.stringify(
                job,
                null,
                2
            );

        rawJson.classList.add(
            "hidden"
        );

        toggleJsonButton.textContent =
            "查看原始 JSON";


        // 显示结果卡片
        resultCard.classList.remove(
            "hidden"
        );


        // 自动滚动到结果
        resultCard.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }


    // 解析 JD
    parseButton.addEventListener(
        "click",
        async () => {

            const jdText =
                jdInput.value.trim();

            if (!jdText) {

                status.textContent =
                    "请先粘贴岗位 JD。";

                status.className =
                    "status error";

                return;
            }

            if (jdText.length < 30) {

                status.textContent =
                    "JD 内容过短，请输入完整岗位描述。";

                status.className =
                    "status error";

                return;
            }


            parseButton.disabled = true;

            sampleButton.disabled = true;

            status.textContent =
                "正在调用 AI 解析 JD，请稍候……";

            status.className =
                "status";


            try {

                const response =
                    await fetch(
                        "/api/jd/parse",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "Accept":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                jd_text: jdText
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "JD 解析失败。"
                    );
                }


                renderJobResult(
                    data
                );


                status.textContent =
                    `解析完成，共处理 ${data.text_length} 个字符。`;

                status.className =
                    "status success";


            } catch (error) {

                console.error(
                    error
                );

                status.textContent =
                    `解析失败：${error.message}`;

                status.className =
                    "status error";

            } finally {

                parseButton.disabled = false;

                sampleButton.disabled = false;
            }
        }
    );


    // 示例 JD
    sampleButton.addEventListener(
        "click",
        () => {

            jdInput.value =
                sampleJD;

            status.textContent =
                "已填入示例 JD，可以直接点击 AI 解析。";

            status.className =
                "status";

            jdInput.focus();
        }
    );


    // 清空
    clearButton.addEventListener(
        "click",
        () => {

            jdInput.value = "";

            resultCard.classList.add(
                "hidden"
            );

            status.textContent =
                "";

            rawJson.textContent =
                "";

            jdInput.focus();
        }
    );


    // 查看 / 隐藏 JSON
    toggleJsonButton.addEventListener(
        "click",
        () => {

            const hidden =
                rawJson.classList.contains(
                    "hidden"
                );

            rawJson.classList.toggle(
                "hidden"
            );

            toggleJsonButton.textContent =
                hidden
                    ? "隐藏原始 JSON"
                    : "查看原始 JSON";
        }
    );

</script>

</body>
</html>
