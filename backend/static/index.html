<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>CareerPilot AI</title>
<style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:0 20px}.card{border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:20px}button{padding:10px 18px;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;background:#f6f6f6;padding:16px;border-radius:8px}</style>
</head><body>
<h1>CareerPilot AI</h1><p>US01：简历上传与解析</p>
<div class="card"><input id="resume" type="file" accept=".pdf,.docx"><button id="submit">上传并解析</button><div id="status"></div></div>
<div class="card"><h2>个人求职画像</h2><pre id="result">等待上传……</pre></div>
<script>
const f=document.getElementById('resume'),b=document.getElementById('submit'),s=document.getElementById('status'),r=document.getElementById('result');
b.onclick=async()=>{if(!f.files[0]){s.textContent='请选择 PDF 或 DOCX 简历。';return}
const fd=new FormData();fd.append('file',f.files[0]);b.disabled=true;s.textContent='正在解析……';
try{const x=await fetch('/api/resume/parse',{method:'POST',body:fd});const d=await x.json();if(!x.ok)throw Error(d.detail||'解析失败');r.textContent=JSON.stringify(d.profile,null,2);s.textContent=`完成：${d.filename}，提取 ${d.text_length} 个字符。`}catch(e){s.textContent='失败：'+e.message}finally{b.disabled=false}};
</script></body></html>
