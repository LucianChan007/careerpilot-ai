<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CareerPilot AI - 岗位匹配</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            margin: 0 0 18px;
            font-size: 20px;
            color: #111827;
        }

        /* =====================================================
           个人画像
        ====================================================== */

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;

            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 20px;
        }

        .profile-name {
            margin: 0 0 7px;
            font-size: 26px;
            color: #111827;
        }

        .profile-basic {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.7;
        }

        .profile-badge {
            background: #eef2ff;
            color: #4338ca;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .profile-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
        }

        .profile-section.full {
            grid-column: 1 / -1;
        }

        .profile-label {
            font-size: 13px;
            font-weight: bold;
            color: #374151;
            margin-bottom: 10px;
        }

        .profile-text {
            font-size: 14px;
            line-height: 1.7;
            color: #4b5563;
        }

        .profile-item {
            margin-bottom: 12px;
        }

        .profile-item:last-child {
            margin-bottom: 0;
        }

        .profile-item-title {
            font-size: 14px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 4px;
        }

        .profile-item-text {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.7;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 13px;
        }

        /* =====================================================
           岗位
        ====================================================== */

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;

            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 20px;
        }

        .position {
            margin: 0 0 8px;
            font-size: 28px;
            color: #111827;
        }

        .company {
            color: #6b7280;
            font-size: 14px;
        }

        .ai-badge {
            background: #ecfdf5;
            color: #047857;
            border-radius: 999px;
            padding: 8px 13px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .meta-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
        }

        .meta-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 7px;
        }

        .meta-value {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            word-break: break-word;
        }

        /* =====================================================
           薪资
        ====================================================== */

        .salary-box {
            margin-top: 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 15px 16px;
        }

        .salary-title {
            font-size: 12px;
            color: #15803d;
            margin-bottom: 6px;
        }

        .salary-value {
            font-size: 18px;
            font-weight: bold;
            color: #166534;
        }

        .salary-note {
            margin-top: 6px;
            font-size: 12px;
            color: #4b5563;
        }

        /* =====================================================
           综合匹配结果
        ====================================================== */

        .summary {
            padding: 22px;
            border-radius: 14px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            margin-bottom: 22px;
        }

        .summary-title {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 25px;
            font-weight: bold;
        }

        .summary-good {
            color: #15803d;
        }

        .summary-warning {
            color: #b45309;
        }

        .summary-bad {
            color: #dc2626;
        }

        .summary-info {
            color: #4338ca;
        }

        /* =====================================================
           条件匹配
        ====================================================== */

        .condition-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .condition-item {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
        }

        .condition-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .condition-name {
            font-size: 15px;
            font-weight: bold;
            color: #111827;
        }

        .condition-requirement {
            margin-top: 7px;
            font-size: 14px;
            color: #374151;
            line-height: 1.6;
        }

        .condition-evidence {
            margin-top: 8px;
            font-size: 13px;
            color: #6b7280;
            line-height: 1.6;
        }

        .status-badge {
            flex-shrink: 0;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pass {
            background: #dcfce7;
            color: #166534;
        }

        .status-fail {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-unknown {
            background: #fef3c7;
            color: #92400e;
        }

        /* =====================================================
           Gap / 原因
        ====================================================== */

        .section {
            margin-top: 26px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #111827;
        }

        .gap-list,
        .reason-list {
            margin: 0;
            padding-left: 22px;
        }

        .gap-list li,
        .reason-list li {
            margin-bottom: 8px;
            font-size: 14px;
            line-height: 1.7;
        }

        .empty {
            color: #9ca3af;
            font-size: 14px;
        }

        /* =====================================================
           按钮
        ====================================================== */

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        .primary {
            background: #4f46e5;
            color: #ffffff;
        }

        .primary:hover {
            background: #4338ca;
        }

        .secondary {
            background: #eef2ff;
            color: #4338ca;
        }

        .secondary:hover {
            background: #e0e7ff;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            min-height: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .success {
            color: #15803d !important;
        }

        .error {
            color: #dc2626 !important;
        }

        .loading {
            color: #4338ca !important;
        }

        /* =====================================================
           JSON
        ====================================================== */

        pre {
            margin: 0;
            background: #111827;
            color: #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
            line-height: 1.6;
        }

        /* =====================================================
           响应式
        ====================================================== */

        @media (max-width: 800px) {

            .meta-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .profile-section.full {
                grid-column: auto;
            }

            .job-header,
            .profile-header {
                flex-direction: column;
            }
        }

        @media (max-width: 500px) {

            .container {
                padding: 24px 14px 40px;
            }

            .meta-grid {
                grid-template-columns: 1fr;
            }

            .position {
                font-size: 23px;
            }

            .profile-name {
                font-size: 22px;
            }

            .condition-top {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <!-- =====================================================
         页面标题
    ====================================================== -->

    <div class="header">

        <h1>
            CareerPilot AI
        </h1>

        <div class="subtitle">
            US04：岗位硬性条件匹配
        </div>

    </div>


    <!-- =====================================================
         我的个人画像
    ====================================================== -->

    <div class="card">

        <div class="profile-header">

            <div>

                <h2
                    id="profileName"
                    class="profile-name"
                >
                    正在读取个人画像……
                </h2>

                <div
                    id="profileBasic"
                    class="profile-basic"
                >
                    -
                </div>

            </div>

            <div class="profile-badge">
                当前匹配画像
            </div>

        </div>


        <div class="profile-grid">

            <div class="profile-section">

                <div class="profile-label">
                    求职方向
                </div>

                <div
                    id="targetPositions"
                    class="profile-text"
                >
                    未提供
                </div>

            </div>


            <div class="profile-section">

                <div class="profile-label">
                    目标城市
                </div>

                <div
                    id="targetCities"
                    class="profile-text"
                >
                    未提供
                </div>

            </div>


            <div class="profile-section">

                <div class="profile-label">
                    实习时间
                </div>

                <div
                    id="availability"
                    class="profile-text"
                >
                    未提供
                </div>

            </div>


            <div class="profile-section">

                <div class="profile-label">
                    技能
                </div>

                <div
                    id="profileSkills"
                    class="tags"
                >
                </div>

            </div>


            <div class="profile-section full">

                <div class="profile-label">
                    项目经历
                </div>

                <div
                    id="profileProjects"
                >
                </div>

            </div>


            <div class="profile-section full">

                <div class="profile-label">
                    实习经历
                </div>

                <div
                    id="profileInternships"
                >
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         岗位信息
    ====================================================== -->

    <div class="card">

        <div class="job-header">

            <div>

                <h2
                    id="position"
                    class="position"
                >
                    正在读取岗位……
                </h2>

                <div
                    id="company"
                    class="company"
                >
                    公司：-
                </div>

            </div>


            <div class="ai-badge">
                AI 岗位匹配
            </div>

        </div>


        <div class="meta-grid">

            <div class="meta-item">

                <div class="meta-label">
                    工作地点
                </div>

                <div
                    id="location"
                    class="meta-value"
                >
                    -
                </div>

            </div>


            <div class="meta-item">

                <div class="meta-label">
                    学历要求
                </div>

                <div
                    id="education"
                    class="meta-value"
                >
                    -
                </div>

            </div>


            <div class="meta-item">

                <div class="meta-label">
                    实习周期
                </div>

                <div
                    id="internshipDays"
                    class="meta-value"
                >
                    -
                </div>

            </div>


            <div class="meta-item">

                <div class="meta-label">
                    专业要求
                </div>

                <div
                    id="major"
                    class="meta-value"
                >
                    -
                </div>

            </div>

        </div>


        <!-- 薪资 -->

        <div class="salary-box">

            <div class="salary-title">
                岗位薪资
            </div>

            <div
                id="salary"
                class="salary-value"
            >
                未提供
            </div>

            <div class="salary-note">
                薪资属于岗位信息展示字段，不参与硬性条件匹配。
            </div>

        </div>

    </div>


    <!-- =====================================================
         US04 匹配结果
    ====================================================== -->

    <div class="card">

        <h2 class="card-title">
            硬性条件匹配
        </h2>


        <div class="summary">

            <div class="summary-title">
                综合匹配结论
            </div>

            <div
                id="overallStatus"
                class="summary-value summary-info"
            >
                等待匹配
            </div>

        </div>


        <div class="section">

            <div class="section-title">
                条件明细
            </div>


            <div
                id="conditionList"
                class="condition-list"
            >

                <div class="empty">
                    尚未进行岗位匹配。
                </div>

            </div>

        </div>


        <!-- Gap -->

        <div
            id="gapSection"
            class="section"
            style="display: none;"
        >

            <div class="section-title">
                可能存在的能力 Gap
            </div>

            <ul
                id="gapList"
                class="gap-list"
            >
            </ul>

        </div>


        <!-- 原因 -->

        <div
            id="reasonSection"
            class="section"
            style="display: none;"
        >

            <div class="section-title">
                匹配依据
            </div>

            <ul
                id="reasonList"
                class="reason-list"
            >
            </ul>

        </div>

    </div>


    <!-- =====================================================
         操作区域
    ====================================================== -->

    <div class="card">

        <div class="buttons">

            <button
                id="skillMatchButton"
                class="primary"
                type="button"
                onclick="goToSkillMatch()"
            >
                深入分析技能匹配
            </button>


            <button
                class="secondary"
                type="button"
                onclick="goBackToJD()"
            >
                返回 JD 解析
            </button>


            <button
                id="rematchButton"
                class="secondary"
                type="button"
                onclick="matchJob()"
            >
                重新匹配
            </button>

        </div>


        <div id="status"></div>

    </div>


    <!-- =====================================================
         原始 JSON
    ====================================================== -->

    <div class="card">

        <h2 class="card-title">
            匹配结果 JSON
        </h2>

        <pre id="rawJSON">等待匹配……</pre>

    </div>

</div>


<script>

    // =========================================================
    // 当前岗位
    // =========================================================

    let currentJob = null;


    // =========================================================
    // 页面元素
    // =========================================================

    const profileNameElement =
        document.getElementById(
            "profileName"
        );

    const profileBasicElement =
        document.getElementById(
            "profileBasic"
        );

    const targetPositionsElement =
        document.getElementById(
            "targetPositions"
        );

    const targetCitiesElement =
        document.getElementById(
            "targetCities"
        );

    const availabilityElement =
        document.getElementById(
            "availability"
        );

    const profileSkillsElement =
        document.getElementById(
            "profileSkills"
        );

    const profileProjectsElement =
        document.getElementById(
            "profileProjects"
        );

    const profileInternshipsElement =
        document.getElementById(
            "profileInternships"
        );

    const positionElement =
        document.getElementById(
            "position"
        );

    const companyElement =
        document.getElementById(
            "company"
        );

    const locationElement =
        document.getElementById(
            "location"
        );

    const educationElement =
        document.getElementById(
            "education"
        );

    const internshipDaysElement =
        document.getElementById(
            "internshipDays"
        );

    const majorElement =
        document.getElementById(
            "major"
        );

    const salaryElement =
        document.getElementById(
            "salary"
        );

    const overallStatusElement =
        document.getElementById(
            "overallStatus"
        );

    const conditionListElement =
        document.getElementById(
            "conditionList"
        );

    const gapSection =
        document.getElementById(
            "gapSection"
        );

    const gapListElement =
        document.getElementById(
            "gapList"
        );

    const reasonSection =
        document.getElementById(
            "reasonSection"
        );

    const reasonListElement =
        document.getElementById(
            "reasonList"
        );

    const rawJSONElement =
        document.getElementById(
            "rawJSON"
        );

    const statusElement =
        document.getElementById(
            "status"
        );


    // =========================================================
    // 页面加载
    // =========================================================

    window.addEventListener(
        "DOMContentLoaded",
        async () => {

            await loadJob();

        }
    );


    // =========================================================
    // 读取当前岗位
    // =========================================================

    async function loadJob() {

        const savedJob =
            sessionStorage.getItem(
                "careerpilot_job"
            );


        if (!savedJob) {

            positionElement.textContent =
                "没有找到岗位信息";


            statusElement.textContent =
                "请先返回 JD 解析页面完成岗位解析。";

            statusElement.className =
                "error";


            return;

        }


        try {

            currentJob =
                JSON.parse(
                    savedJob
                );

        } catch (error) {

            console.error(
                "岗位 JSON 读取失败：",
                error
            );


            positionElement.textContent =
                "岗位信息读取失败";


            statusElement.textContent =
                "保存的岗位数据格式错误。";

            statusElement.className =
                "error";


            return;

        }


        renderJob(
            currentJob
        );


        await matchJob();

    }


    // =========================================================
    // 展示岗位
    // =========================================================

    function renderJob(
        job
    ) {

        positionElement.textContent =
            job.position ||
            "未识别岗位";


        companyElement.textContent =
            "公司：" +
            (
                job.company ||
                "未提供"
            );


        locationElement.textContent =
            job.location ||
            "未提供";


        educationElement.textContent =
            job.required_education ||
            "未提供";


        internshipDaysElement.textContent =
            job.internship_days ||
            "未提供";


        if (
            Array.isArray(
                job.required_major
            ) &&
            job.required_major.length > 0
        ) {

            majorElement.textContent =
                job.required_major.join(
                    "、"
                );

        } else {

            majorElement.textContent =
                "未提供";

        }


        salaryElement.textContent =
            job.salary ||
            "未提供";

    }


    // =========================================================
    // 展示个人画像
    // =========================================================

    function renderProfile(
        profile
    ) {

        if (
            !profile ||
            typeof profile !== "object"
        ) {

            profileNameElement.textContent =
                "个人画像不存在";

            profileBasicElement.textContent =
                "未读取到当前用户个人画像。";

            return;

        }


        // 姓名

        profileNameElement.textContent =
            profile.name ||
            "未提供姓名";


        // 教育背景

        const education =
            Array.isArray(
                profile.education
            )
                ? profile.education
                : [];


        if (
            education.length > 0
        ) {

            const educationTexts =
                education.map(
                    item => {

                        if (
                            typeof item ===
                            "string"
                        ) {

                            return item;

                        }


                        if (
                            typeof item ===
                            "object" &&
                            item !== null
                        ) {

                            return Object.values(
                                item
                            )
                                .filter(
                                    value =>
                                        value !== null &&
                                        value !== undefined &&
                                        String(value).trim() !== ""
                                )
                                .join(
                                    " · "
                                );

                        }


                        return String(
                            item
                        );

                    }
                );


            profileBasicElement.textContent =
                educationTexts.join(
                    "；"
                );

        } else {

            profileBasicElement.textContent =
                "暂无教育背景信息";

        }


        // 求职方向

        targetPositionsElement.textContent =
            formatValue(
                profile.target_positions
            );


        // 目标城市

        targetCitiesElement.textContent =
            formatValue(
                profile.target_cities
            );


        // 实习时间

        availabilityElement.textContent =
            formatValue(
                profile.availability
            );


        // 技能

        renderTags(
            profileSkillsElement,
            profile.skills
        );


        // 项目

        renderProfileItems(
            profileProjectsElement,
            profile.projects
        );


        // 实习

        renderProfileItems(
            profileInternshipsElement,
            profile.internships
        );

    }


    // =========================================================
    // 格式化普通字段
    // =========================================================

    function formatValue(
        value
    ) {

        if (
            Array.isArray(value)
        ) {

            if (
                value.length === 0
            ) {

                return "未提供";

            }


            return value
                .map(
                    item => {

                        if (
                            typeof item ===
                            "string"
                        ) {

                            return item;

                        }


                        if (
                            typeof item ===
                            "object" &&
                            item !== null
                        ) {

                            return Object.values(
                                item
                            )
                                .filter(
                                    value =>
                                        value !== null &&
                                        value !== undefined &&
                                        String(value).trim() !== ""
                                )
                                .join(
                                    " · "
                                );

                        }


                        return String(
                            item
                        );

                    }
                )
                .join("、");

        }


        if (
            value === null ||
            value === undefined ||
            String(value).trim() === ""
        ) {

            return "未提供";

        }


        return String(
            value
        );

    }


    // =========================================================
    // 渲染个人技能标签
    // =========================================================

    function renderTags(
        element,
        items
    ) {

        element.innerHTML =
            "";


        if (
            !Array.isArray(items) ||
            items.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty";

            empty.textContent =
                "未提供";

            element.appendChild(
                empty
            );

            return;

        }


        items.forEach(
            item => {

                const tag =
                    document.createElement(
                        "span"
                    );

                tag.className =
                    "tag";


                if (
                    typeof item === "string"
                ) {

                    tag.textContent =
                        item;

                } else {

                    tag.textContent =
                        Object.values(
                            item
                        )
                            .filter(
                                value =>
                                    value !== null &&
                                    value !== undefined &&
                                    String(value).trim() !== ""
                            )
                            .join(
                                " · "
                            );

                }


                element.appendChild(
                    tag
                );

            }
        );

    }


    // =========================================================
    // 渲染项目 / 实习
    // =========================================================

    function renderProfileItems(
        element,
        items
    ) {

        element.innerHTML =
            "";


        if (
            !Array.isArray(items) ||
            items.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty";

            empty.textContent =
                "未提供";

            element.appendChild(
                empty
            );

            return;

        }


        items.forEach(
            item => {

                const wrapper =
                    document.createElement(
                        "div"
                    );

                wrapper.className =
                    "profile-item";


                if (
                    typeof item === "string"
                ) {

                    const title =
                        document.createElement(
                            "div"
                        );

                    title.className =
                        "profile-item-title";

                    title.textContent =
                        item;

                    wrapper.appendChild(
                        title
                    );

                } else if (
                    typeof item === "object" &&
                    item !== null
                ) {

                    const entries =
                        Object.entries(
                            item
                        );

                    let first =
                        true;


                    entries.forEach(
                        ([key, value]) => {

                            if (
                                value === null ||
                                value === undefined ||
                                String(value).trim() === ""
                            ) {

                                return;

                            }


                            const div =
                                document.createElement(
                                    "div"
                                );


                            if (first) {

                                div.className =
                                    "profile-item-title";

                                div.textContent =
                                    String(
                                        value
                                    );

                                first =
                                    false;

                            } else {

                                div.className =
                                    "profile-item-text";

                                div.textContent =
                                    key +
                                    "：" +
                                    String(
                                        value
                                    );

                            }


                            wrapper.appendChild(
                                div
                            );

                        }
                    );

                }


                element.appendChild(
                    wrapper
                );

            }
        );

    }


    // =========================================================
    // 执行 US04 匹配
    // =========================================================

    async function matchJob() {

        if (!currentJob) {

            statusElement.textContent =
                "没有可匹配的岗位。";

            statusElement.className =
                "error";

            return;

        }


        statusElement.textContent =
            "正在根据你的真实个人画像进行岗位匹配，请稍候……";

        statusElement.className =
            "loading";


        overallStatusElement.textContent =
            "分析中……";

        overallStatusElement.className =
            "summary-value summary-info";


        try {

            const response =
                await fetch(
                    "/api/jd/match",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body: JSON.stringify({
                            job:
                                currentJob
                        })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.detail ||
                    "岗位匹配失败。"
                );

            }


            // 展示真实个人画像
            renderProfile(
                data.profile
            );


            // 展示匹配结果
            renderMatchResult(
                data
            );


            // 保存结果 JSON
            rawJSONElement.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );


            statusElement.textContent =
                "岗位硬性条件匹配完成。";

            statusElement.className =
                "success";


        } catch (error) {

            console.error(
                "岗位匹配错误：",
                error
            );


            statusElement.textContent =
                "匹配失败：" +
                error.message;

            statusElement.className =
                "error";


            overallStatusElement.textContent =
                "匹配失败";

            overallStatusElement.className =
                "summary-value summary-bad";

        }

    }


    // =========================================================
    // 渲染 US04 匹配结果
    // =========================================================

    function renderMatchResult(
        data
    ) {

        const match =
            data.match ||
            {};


        const overallStatus =
            match.overall_status ||
            "信息不足";


        overallStatusElement.textContent =
            overallStatus;


        if (
            overallStatus ===
            "满足硬性条件"
        ) {

            overallStatusElement.className =
                "summary-value summary-good";

        } else if (
            overallStatus ===
            "存在硬性不匹配"
        ) {

            overallStatusElement.className =
                "summary-value summary-bad";

        } else {

            overallStatusElement.className =
                "summary-value summary-warning";

        }


        renderConditions(
            match.conditions
        );


        renderGaps(
            match.gaps
        );


        renderReasons(
            match.reasons
        );

    }


    // =========================================================
    // 条件明细
    // =========================================================

    function renderConditions(
        conditions
    ) {

        conditionListElement.innerHTML =
            "";


        if (
            !Array.isArray(
                conditions
            ) ||
            conditions.length === 0
        ) {

            conditionListElement.innerHTML =
                `
                <div class="empty">
                    当前没有可判断的硬性条件。
                </div>
                `;

            return;

        }


        conditions.forEach(
            condition => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "condition-item";


                const top =
                    document.createElement(
                        "div"
                    );

                top.className =
                    "condition-top";


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "condition-name";

                name.textContent =
                    condition.category ||
                    "未分类条件";


                const badge =
                    document.createElement(
                        "span"
                    );

                badge.className =
                    "status-badge";


                const status =
                    condition.status ||
                    "信息不足";


                if (
                    status === "满足"
                ) {

                    badge.classList.add(
                        "status-pass"
                    );

                } else if (
                    status === "不满足"
                ) {

                    badge.classList.add(
                        "status-fail"
                    );

                } else {

                    badge.classList.add(
                        "status-unknown"
                    );

                }


                badge.textContent =
                    status;


                top.appendChild(
                    name
                );

                top.appendChild(
                    badge
                );


                const requirement =
                    document.createElement(
                        "div"
                    );

                requirement.className =
                    "condition-requirement";

                requirement.textContent =
                    "岗位要求：" +
                    (
                        condition.requirement ||
                        "未明确"
                    );


                const evidence =
                    document.createElement(
                        "div"
                    );

                evidence.className =
                    "condition-evidence";

                evidence.textContent =
                    "匹配依据：" +
                    (
                        condition.evidence ||
                        "暂无明确依据"
                    );


                item.appendChild(
                    top
                );

                item.appendChild(
                    requirement
                );

                item.appendChild(
                    evidence
                );


                conditionListElement.appendChild(
                    item
                );

            }
        );

    }


    // =========================================================
    // Gap
    // =========================================================

    function renderGaps(
        gaps
    ) {

        gapListElement.innerHTML =
            "";


        if (
            !Array.isArray(gaps) ||
            gaps.length === 0
        ) {

            gapSection.style.display =
                "none";

            return;

        }


        gaps.forEach(
            gap => {

                const li =
                    document.createElement(
                        "li"
                    );

                li.textContent =
                    gap;


                gapListElement.appendChild(
                    li
                );

            }
        );


        gapSection.style.display =
            "block";

    }


    // =========================================================
    // 匹配原因
    // =========================================================

    function renderReasons(
        reasons
    ) {

        reasonListElement.innerHTML =
            "";


        if (
            !Array.isArray(reasons) ||
            reasons.length === 0
        ) {

            reasonSection.style.display =
                "none";

            return;

        }


        reasons.forEach(
            reason => {

                const li =
                    document.createElement(
                        "li"
                    );

                li.textContent =
                    reason;


                reasonListElement.appendChild(
                    li
                );

            }
        );


        reasonSection.style.display =
            "block";

    }


    // =========================================================
    // 前往 US05
    // =========================================================

    function goToSkillMatch() {

        const savedJob =
            sessionStorage.getItem(
                "careerpilot_job"
            );


        if (!savedJob) {

            statusElement.textContent =
                "当前没有可用的岗位信息，请先完成 JD 解析。";

            statusElement.className =
                "error";

            return;

        }


        window.location.href =
            "/skills";

    }


    // =========================================================
    // 返回 US03
    // =========================================================

    function goBackToJD() {

        window.location.href =
            "/jd";

    }

</script>
