<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>岗位匹配分析 - CareerPilot AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 32px 0 60px;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #111827;
        }

        .header p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow:
                0 4px 16px rgba(15, 23, 42, 0.06);
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 20px;
            color: #111827;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .job-title {
            margin: 0;
            font-size: 26px;
            color: #111827;
        }

        .job-company {
            margin-top: 8px;
            color: #6b7280;
        }

        .salary {
            padding: 10px 16px;
            border-radius: 10px;
            background: #fff7ed;
            color: #c2410c;
            font-weight: 700;
            white-space: nowrap;
        }

        .info-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 20px;
        }

        .info-item {
            padding: 14px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .info-label {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 15px;
            color: #111827;
            word-break: break-word;
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .status-box.positive {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        .status-box.warning {
            background: #fffbeb;
            border: 1px solid #fde68a;
        }

        .status-box.negative {
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .status-box.unknown {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .status-icon {
            font-size: 28px;
        }

        .status-content {
            flex: 1;
        }

        .status-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .status-description {
            font-size: 14px;
            color: #6b7280;
        }

        .profile-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .profile-section {
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .profile-section h3 {
            margin: 0 0 10px;
            font-size: 15px;
            color: #374151;
        }

        .profile-value {
            color: #111827;
            font-size: 14px;
            line-height: 1.7;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 13px;
        }

        .condition-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .condition-item {
            padding: 16px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
        }

        .condition-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px;
        }

        .condition-name {
            font-weight: 700;
            color: #111827;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-info {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .condition-detail {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .detail-block {
            padding: 12px;
            background: white;
            border-radius: 8px;
        }

        .detail-label {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .detail-value {
            color: #111827;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .text-list {
            margin: 0;
            padding-left: 20px;
        }

        .text-list li {
            margin-bottom: 8px;
            line-height: 1.7;
        }

        .empty {
            color: #9ca3af;
            font-size: 14px;
        }

        .salary-note {
            margin-top: 12px;
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 10px;
            color: #6b7280;
            font-size: 13px;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        button.primary {
            background: #2563eb;
            color: white;
        }

        button.secondary {
            background: #e5e7eb;
            color: #374151;
        }

        button.green {
            background: #059669;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #6b7280;
        }

        .error {
            padding: 16px;
            border-radius: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .raw-json {
            margin-top: 15px;
        }

        .raw-json summary {
            cursor: pointer;
            color: #2563eb;
            font-size: 14px;
        }

        .raw-json pre {
            margin-top: 12px;
            padding: 16px;
            background: #111827;
            color: #e5e7eb;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .container {
                width: 94%;
                padding-top: 20px;
            }

            .info-grid,
            .profile-grid,
            .condition-detail {
                grid-template-columns: 1fr;
            }

            .job-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>岗位匹配分析</h1>
        <p>
            CareerPilot AI · US04 硬性条件匹配
        </p>
    </div>

    <div id="errorBox"></div>

    <div id="loading" class="loading">
        正在加载岗位与个人画像...
    </div>

    <div id="content" style="display: none;">

        <!-- ================================================== -->
        <!-- 岗位信息 -->
        <!-- ================================================== -->

        <div class="card">
            <div class="job-header">

                <div>
                    <h2
                        id="jobPosition"
                        class="job-title"
                    >
                        -
                    </h2>

                    <div
                        id="jobCompany"
                        class="job-company"
                    >
                        -
                    </div>
                </div>

                <div
                    id="jobSalary"
                    class="salary"
                >
                    薪资信息加载中
                </div>

            </div>

            <div class="info-grid">

                <div class="info-item">
                    <div class="info-label">
                        工作地点
                    </div>

                    <div
                        id="jobLocation"
                        class="info-value"
                    >
                        -
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-label">
                        学历要求
                    </div>

                    <div
                        id="jobEducation"
                        class="info-value"
                    >
                        -
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-label">
                        专业要求
                    </div>

                    <div
                        id="jobMajor"
                        class="info-value"
                    >
                        -
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-label">
                        实习时间
                    </div>

                    <div
                        id="jobInternshipDays"
                        class="info-value"
                    >
                        -
                    </div>
                </div>

            </div>

            <div class="salary-note">
                薪资信息仅作为岗位信息展示，不参与硬性条件匹配。
            </div>
        </div>


        <!-- ================================================== -->
        <!-- 总体匹配结论 -->
        <!-- ================================================== -->

        <div class="card">

            <h2>总体匹配结论</h2>

            <div
                id="overallStatusBox"
                class="status-box unknown"
            >

                <div
                    id="statusIcon"
                    class="status-icon"
                >
                    ℹ️
                </div>

                <div class="status-content">

                    <div
                        id="overallStatus"
                        class="status-title"
                    >
                        正在分析
                    </div>

                    <div
                        id="overallDescription"
                        class="status-description"
                    >
                        正在进行岗位硬性条件匹配。
                    </div>

                </div>

            </div>

        </div>


        <!-- ================================================== -->
        <!-- 用户个人画像 -->
        <!-- ================================================== -->

        <div class="card">

            <h2>我的个人画像</h2>

            <div class="profile-grid">

                <div class="profile-section">

                    <h3>基本信息</h3>

                    <div
                        id="profileBasic"
                        class="profile-value"
                    >
                        -
                    </div>

                </div>


                <div class="profile-section">

                    <h3>教育经历</h3>

                    <div
                        id="profileEducation"
                        class="profile-value"
                    >
                        -
                    </div>

                </div>


                <div class="profile-section">

                    <h3>技能</h3>

                    <div
                        id="profileSkills"
                        class="tag-list"
                    >
                        -
                    </div>

                </div>


                <div class="profile-section">

                    <h3>目标岗位</h3>

                    <div
                        id="profileTarget"
                        class="profile-value"
                    >
                        -
                    </div>

                </div>

            </div>

        </div>


        <!-- ================================================== -->
        <!-- 硬性条件匹配 -->
        <!-- ================================================== -->

        <div class="card">

            <h2>硬性条件匹配</h2>

            <div
                id="conditionList"
                class="condition-list"
            >
            </div>

        </div>


        <!-- ================================================== -->
        <!-- 缺口 -->
        <!-- ================================================== -->

        <div class="card">

            <h2>主要缺口</h2>

            <div id="gapBox">
                <div class="empty">
                    正在分析...
                </div>
            </div>

        </div>


        <!-- ================================================== -->
        <!-- 匹配理由 -->
        <!-- ================================================== -->

        <div class="card">

            <h2>匹配理由</h2>

            <div id="reasonBox">
                <div class="empty">
                    正在分析...
                </div>
            </div>

        </div>


        <!-- ================================================== -->
        <!-- 操作按钮 -->
        <!-- ================================================== -->

        <div class="card">

            <h2>深入分析</h2>

            <p
                style="
                    margin-top: 0;
                    color: #6b7280;
                    font-size: 14px;
                "
            >
                在硬性条件匹配完成后，可以继续分析技能以及项目 / 实习经历与岗位的匹配程度。
            </p>

            <div class="button-group">

                <button
                    class="primary"
                    type="button"
                    onclick="goToSkillMatch()"
                >
                    深入分析技能匹配
                </button>

                <button
                    class="primary"
                    type="button"
                    onclick="goToExperienceMatch()"
                >
                    分析项目 / 经历匹配
                </button>

                <button
                    class="secondary"
                    type="button"
                    onclick="goBackToJD()"
                >
                    返回 JD 解析
                </button>

                <button
                    class="secondary"
                    type="button"
                    onclick="reanalyze()"
                >
                    重新分析
                </button>

            </div>

        </div>


        <!-- ================================================== -->
        <!-- 原始 JSON -->
        <!-- ================================================== -->

        <div class="card raw-json">

            <details>

                <summary>
                    查看原始匹配结果 JSON
                </summary>

                <pre id="rawJson"></pre>

            </details>

        </div>

    </div>

</div>


<script>

    // ========================================================
    // 基础工具函数
    // ========================================================

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function normalizeArray(value) {

        if (Array.isArray(value)) {
            return value;
        }

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return [];
        }

        return [value];
    }


    function formatArray(value) {

        const arr = normalizeArray(value);

        if (arr.length === 0) {
            return "暂无信息";
        }

        return arr
            .map(item => escapeHtml(item))
            .join("、");
    }


    function getStatusClass(status) {

        switch (status) {

            case "满足":
                return "badge-success";

            case "部分匹配":
                return "badge-warning";

            case "不满足":
                return "badge-danger";

            case "信息不足":
                return "badge-info";

            default:
                return "badge-info";
        }
    }


    function getOverallClass(status) {

        if (!status) {
            return "unknown";
        }

        if (
            status.includes("满足") &&
            !status.includes("不满足")
        ) {
            return "positive";
        }

        if (
            status.includes("缺口") ||
            status.includes("不满足")
        ) {
            return "negative";
        }

        if (
            status.includes("一般") ||
            status.includes("部分")
        ) {
            return "warning";
        }

        return "unknown";
    }


    function getStatusIcon(status) {

        if (!status) {
            return "ℹ️";
        }

        if (
            status.includes("满足") &&
            !status.includes("不满足")
        ) {
            return "✅";
        }

        if (
            status.includes("不满足") ||
            status.includes("缺口")
        ) {
            return "❌";
        }

        if (
            status.includes("一般") ||
            status.includes("部分")
        ) {
            return "⚠️";
        }

        return "ℹ️";
    }


    // ========================================================
    // 页面初始化
    // ========================================================

    async function init() {

        const savedJob =
            sessionStorage.getItem(
                "careerpilot_job"
            );

        if (!savedJob) {

            showError(
                "当前没有可用岗位信息，请先完成 JD 解析。"
            );

            return;
        }

        let job;

        try {

            job = JSON.parse(
                savedJob
            );

        } catch (error) {

            showError(
                "岗位信息读取失败，请重新进行 JD 解析。"
            );

            return;
        }

        try {

            showLoading(true);

            const response =
                await fetch(
                    "/api/jd/match",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            job: job
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "岗位匹配分析失败。"
                );
            }

            renderPage(data);

        } catch (error) {

            console.error(error);

            showError(
                error.message ||
                "岗位匹配分析失败，请检查后端服务。"
            );

        } finally {

            showLoading(false);
        }
    }


    // ========================================================
    // 页面渲染
    // ========================================================

    function renderPage(data) {

        const job =
            data.job || {};

        const profile =
            data.profile || {};

        const match =
            data.match || {};


        // ----------------------------------------------------
        // 岗位信息
        // ----------------------------------------------------

        document.getElementById(
            "jobPosition"
        ).textContent =
            job.position || "未提供岗位名称";


        document.getElementById(
            "jobCompany"
        ).textContent =
            job.company || "未提供公司名称";


        document.getElementById(
            "jobSalary"
        ).textContent =
            job.salary || "薪资未提供";


        document.getElementById(
            "jobLocation"
        ).textContent =
            job.location || "未提供";


        document.getElementById(
            "jobEducation"
        ).textContent =
            job.required_education ||
            "未提供";


        document.getElementById(
            "jobMajor"
        ).textContent =
            formatArray(
                job.required_major
            );


        document.getElementById(
            "jobInternshipDays"
        ).textContent =
            job.internship_days ||
            "未提供";


        // ----------------------------------------------------
        // 总体结论
        // ----------------------------------------------------

        const overallStatus =
            match.overall_status ||
            match.status ||
            "信息不足";

        const overallClass =
            getOverallClass(
                overallStatus
            );

        const statusIcon =
            getStatusIcon(
                overallStatus
            );


        const statusBox =
            document.getElementById(
                "overallStatusBox"
            );

        statusBox.className =
            "status-box " +
            overallClass;


        document.getElementById(
            "statusIcon"
        ).textContent =
            statusIcon;


        document.getElementById(
            "overallStatus"
        ).textContent =
            overallStatus;


        document.getElementById(
            "overallDescription"
        ).textContent =
            getOverallDescription(
                overallStatus
            );


        // ----------------------------------------------------
        // 个人画像
        // ----------------------------------------------------

        renderProfile(
            profile
        );


        // ----------------------------------------------------
        // 硬性条件
        // ----------------------------------------------------

        renderConditions(
            match.conditions
        );


        // ----------------------------------------------------
        // 缺口
        // ----------------------------------------------------

        renderListBox(
            "gapBox",
            match.gaps,
            "暂无明显硬性条件缺口。"
        );


        // ----------------------------------------------------
        // 匹配理由
        // ----------------------------------------------------

        renderListBox(
            "reasonBox",
            match.reasons,
            "暂无额外匹配理由。"
        );


        // ----------------------------------------------------
        // 原始 JSON
        // ----------------------------------------------------

        document.getElementById(
            "rawJson"
        ).textContent =
            JSON.stringify(
                data,
                null,
                2
            );


        // ----------------------------------------------------
        // 显示页面
        // ----------------------------------------------------

        document.getElementById(
            "content"
        ).style.display =
            "block";
    }


    // ========================================================
    // 总体结论描述
    // ========================================================

    function getOverallDescription(
        status
    ) {

        if (
            status === "满足" ||
            status.includes("满足")
        ) {

            if (
                status.includes("不满足")
            ) {
                return "部分硬性条件存在不确定性或缺口，请继续查看详细条件。";
            }

            return "当前岗位的主要硬性条件与个人画像基本匹配。";
        }


        if (
            status.includes("不满足") ||
            status.includes("缺口")
        ) {
            return "岗位存在部分硬性条件与个人画像不匹配，建议重点查看下方缺口。";
        }


        if (
            status.includes("一般") ||
            status.includes("部分")
        ) {
            return "部分条件可以满足，但仍存在一定不确定性或缺口。";
        }


        return "当前信息不足，无法对岗位硬性条件做出完整判断。";
    }


    // ========================================================
    // 个人画像渲染
    // ========================================================

    function renderProfile(
        profile
    ) {

        document.getElementById(
            "profileBasic"
        ).innerHTML =
            `
            <strong>
                ${escapeHtml(
                    profile.name ||
                    "未提供姓名"
                )}
            </strong>
            `;


        const education =
            normalizeArray(
                profile.education
            );


        if (
            education.length === 0
        ) {

            document.getElementById(
                "profileEducation"
            ).textContent =
                "暂无教育经历";

        } else {

            document.getElementById(
                "profileEducation"
            ).innerHTML =
                education
                    .map(item => {

                        if (
                            typeof item ===
                            "object"
                        ) {

                            return `
                                <div style="margin-bottom: 8px;">
                                    ${escapeHtml(
                                        item.school ||
                                        item.university ||
                                        ""
                                    )}

                                    ${
                                        escapeHtml(
                                            item.degree ||
                                            ""
                                        )
                                    }

                                    ${
                                        escapeHtml(
                                            item.major ||
                                            ""
                                        )
                                    }

                                    ${
                                        escapeHtml(
                                            item.period ||
                                            ""
                                        )
                                    }
                                </div>
                            `;

                        }

                        return `
                            <div>
                                ${escapeHtml(item)}
                            </div>
                        `;
                    })
                    .join("");
        }


        const skills =
            normalizeArray(
                profile.skills
            );


        const skillContainer =
            document.getElementById(
                "profileSkills"
            );


        if (
            skills.length === 0
        ) {

            skillContainer.innerHTML =
                `
                <span class="empty">
                    暂无技能信息
                </span>
                `;

        } else {

            skillContainer.innerHTML =
                skills
                    .map(skill => {

                        let text =
                            typeof skill ===
                            "object"
                                ? (
                                    skill.name ||
                                    skill.skill ||
                                    JSON.stringify(skill)
                                )
                                : skill;

                        return `
                            <span class="tag">
                                ${escapeHtml(text)}
                            </span>
                        `;

                    })
                    .join("");
        }


        document.getElementById(
            "profileTarget"
        ).textContent =
            formatArray(
                profile.target_positions ||
                profile.targetPositions ||
                profile.target_position
            );
    }


    // ========================================================
    // 条件匹配渲染
    // ========================================================

    function renderConditions(
        conditions
    ) {

        const container =
            document.getElementById(
                "conditionList"
            );


        const list =
            normalizeArray(
                conditions
            );


        if (
            list.length === 0
        ) {

            container.innerHTML =
                `
                <div class="empty">
                    暂无硬性条件匹配结果。
                </div>
                `;

            return;
        }


        container.innerHTML =
            list
                .map(
                    (
                        condition,
                        index
                    ) => {

                        if (
                            typeof condition !==
                            "object"
                        ) {

                            return `
                                <div class="condition-item">
                                    ${escapeHtml(
                                        condition
                                    )}
                                </div>
                            `;
                        }


                        const name =
                            condition.condition ||
                            condition.name ||
                            condition.requirement ||
                            `条件 ${index + 1}`;


                        const status =
                            condition.status ||
                            condition.result ||
                            "信息不足";


                        const required =
                            condition.required ||
                            condition.job_requirement ||
                            condition.requirement_detail ||
                            "未提供";


                        const actual =
                            condition.actual ||
                            condition.profile_value ||
                            condition.user_value ||
                            "未提供";


                        const explanation =
                            condition.explanation ||
                            condition.reason ||
                            condition.evidence ||
                            "暂无说明";


                        return `
                            <div class="condition-item">

                                <div class="condition-header">

                                    <div class="condition-name">
                                        ${escapeHtml(name)}
                                    </div>

                                    <span
                                        class="badge ${getStatusClass(status)}"
                                    >
                                        ${escapeHtml(status)}
                                    </span>

                                </div>

                                <div class="condition-detail">

                                    <div class="detail-block">

                                        <div class="detail-label">
                                            岗位要求
                                        </div>

                                        <div class="detail-value">
                                            ${escapeHtml(
                                                required
                                            )}
                                        </div>

                                    </div>


                                    <div class="detail-block">

                                        <div class="detail-label">
                                            我的情况
                                        </div>

                                        <div class="detail-value">
                                            ${escapeHtml(
                                                actual
                                            )}
                                        </div>

                                    </div>


                                    <div
                                        class="detail-block"
                                        style="grid-column: 1 / -1;"
                                    >

                                        <div class="detail-label">
                                            分析说明
                                        </div>

                                        <div class="detail-value">
                                            ${escapeHtml(
                                                explanation
                                            )}
                                        </div>

                                    </div>

                                </div>

                            </div>
                        `;
                    }
                )
                .join("");
    }


    // ========================================================
    // 列表内容渲染
    // ========================================================

    function renderListBox(
        elementId,
        items,
        emptyText
    ) {

        const container =
            document.getElementById(
                elementId
            );


        const list =
            normalizeArray(
                items
            );


        if (
            list.length === 0
        ) {

            container.innerHTML =
                `
                <div class="empty">
                    ${escapeHtml(emptyText)}
                </div>
                `;

            return;
        }


        container.innerHTML =
            `
            <ul class="text-list">
                ${
                    list
                        .map(
                            item => `
                                <li>
                                    ${escapeHtml(
                                        typeof item ===
                                        "object"
                                            ? JSON.stringify(item)
                                            : item
                                    )}
                                </li>
                            `
                        )
                        .join("")
                }
            </ul>
            `;
    }


    // ========================================================
    // 跳转：US05 技能匹配
    // ========================================================

    function goToSkillMatch() {

        const savedJob =
            sessionStorage.getItem(
                "careerpilot_job"
            );


        if (!savedJob) {

            alert(
                "当前没有可用岗位信息，请先完成 JD 解析。"
            );

            return;
        }


        window.location.href =
            "/skills";
    }


    // ========================================================
    // 跳转：US06 项目 / 经历匹配
    // ========================================================

    function goToExperienceMatch() {

        const savedJob =
            sessionStorage.getItem(
                "careerpilot_job"
            );


        if (!savedJob) {

            alert(
                "当前没有可用岗位信息，请先完成 JD 解析。"
            );

            return;
        }


        window.location.href =
            "/experience";
    }


    // ========================================================
    // 返回 JD
    // ========================================================

    function goBackToJD() {

        window.location.href =
            "/jd";
    }


    // ========================================================
    // 重新分析
    // ========================================================

    function reanalyze() {

        init();
    }


    // ========================================================
    // Loading
    // ========================================================

    function showLoading(
        isLoading
    ) {

        const loading =
            document.getElementById(
                "loading"
            );


        if (isLoading) {

            loading.style.display =
                "block";

        } else {

            loading.style.display =
                "none";
        }
    }


    // ========================================================
    // 错误提示
    // ========================================================

    function showError(
        message
    ) {

        const errorBox =
            document.getElementById(
                "errorBox"
            );


        errorBox.innerHTML =
            `
            <div class="error">
                ${escapeHtml(message)}

                <div
                    class="button-group"
                    style="margin-top: 12px;"
                >
                    <button
                        class="secondary"
                        type="button"
                        onclick="goBackToJD()"
                    >
                        返回 JD 解析
                    </button>
                </div>
            </div>
            `;


        document.getElementById(
            "loading"
        ).style.display =
            "none";
    }


    // ========================================================
    // 页面启动
    // ========================================================

    init();

</script>

</body>
</html>
